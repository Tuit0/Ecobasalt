version: "3.9"

x-restart-policy: &restart unless-stopped

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: *restart
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/basalt.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-make-it-long-and-random}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      MEDIA_DIR: /app/media
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost}
    volumes:
      - basalt_media:/app/media
      - basalt_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - basalt_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: *restart
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - basalt_net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: *restart
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    networks:
      - basalt_net

  nginx:
    image: nginx:alpine
    restart: *restart
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - basalt_media:/var/www/media:ro
    networks:
      - basalt_net

volumes:
  basalt_media:
    name: basalt_media
  basalt_data:
    name: basalt_data

networks:
  basalt_net:
    driver: bridge
